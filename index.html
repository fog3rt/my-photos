<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Project Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --accent: #6366f1;
            --text-main: #1e293b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-main);
            min-height: 100vh;
            /* ANIMATED BACKGROUND */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            padding: 60px 20px;
            text-align: center;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #1e293b, #4f46e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .gallery-item {
            background: var(--glass);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 12px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            height: 300px;
        }

        .gallery-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.9);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            display: block;
        }

        /* LIGHTBOX 2.0 */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        #lightbox img {
            max-width: 85%;
            max-height: 80vh;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover { background: var(--accent); border-color: transparent; }
        #prev-btn { left: 30px; }
        #next-btn { right: 30px; }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            line-height: 1;
        }

        #status {
            padding: 40px;
            background: var(--glass);
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <h1>Visual Archive</h1>
        <p>A modern glimpse into the project folder</p>
    </header>

    <div class="container">
        <div id="status">Syncing with Cloud...</div>
        <div class="gallery-grid" id="gallery"></div>
    </div>

    <div id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <button class="nav-btn" id="prev-btn" onclick="changeImage(-1)">&#10094;</button>
        <img id="lightbox-img" src="" alt="View Large">
        <button class="nav-btn" id="next-btn" onclick="changeImage(1)">&#10095;</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzsOGE8iBVDpRqzh_WH7EVldHQxH4o-Q6kU21VjHyr_Xm5CE0Zy7iHY0eG70mWSnwaJ/exec";
        
        let allImageIds = [];
        let currentIndex = 0;

        const gallery = document.getElementById('gallery');
        const status = document.getElementById('status');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        async function initGallery() {
            try {
                const response = await fetch(API_URL);
                allImageIds = await response.json();

                if (!allImageIds || allImageIds.length === 0) {
                    status.textContent = "Folder is currently empty.";
                    return;
                }

                status.style.display = 'none';

                allImageIds.forEach((id, index) => {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    
                    const thumbUrl = `https://lh3.googleusercontent.com/d/${id}=s600`;
                    
                    const img = document.createElement('img');
                    img.src = thumbUrl;
                    img.loading = "lazy";
                    
                    item.onclick = (e) => {
                        e.stopPropagation();
                        openLightbox(index);
                    };
                    
                    item.appendChild(img);
                    gallery.appendChild(item);
                });

            } catch (error) {
                status.textContent = "Connection Error. Please try again.";
            }
        }

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxImage();
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
        }

        function changeImage(step) {
            currentIndex += step;
            if (currentIndex >= allImageIds.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = allImageIds.length - 1;
            updateLightboxImage();
        }

        function updateLightboxImage() {
            const id = allImageIds[currentIndex];
            // High quality image for lightbox
            lightboxImg.src = `https://lh3.googleusercontent.com/d/${id}=s1600`;
        }

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (lightbox.style.display === 'flex') {
                if (e.key === "ArrowLeft") changeImage(-1);
                if (e.key === "ArrowRight") changeImage(1);
                if (e.key === "Escape") closeLightbox();
            }
        });

        initGallery();
    </script>
</body>
</html>
